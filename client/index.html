<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>File2P</title>
    <link rel="stylesheet" href="/styles/index.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div
      class="bg-card border-4 shadow-brutal-xl w-full max-w-2xl overflow-hidden flex flex-col rounded-lg"
    >
      <header
        class="bg-accent-1 border-b-4 p-1.5 min-h-28 flex items-center justify-center"
      >
        <h1 class="text-white text-6xl font-semibold text-shadow-brutal tracking-tight">
          FILE2P
        </h1>
      </header>

      <div id="tabs" class="flex-1 border-b-4 divide-x-4 grid grid-cols-2">
        <button
          class="bg-transparent p-5 text-xl font-bold cursor-pointer uppercase duration-100 hover:bg-accent-3 data-[active=true]:bg-border data-[active=true]:text-white tab-btn"
          data-tab="send"
          data-active="false"
        >
          Send
        </button>
        <button
          class="bg-transparent p-5 text-xl font-bold cursor-pointer uppercase duration-100 hover:bg-accent-3 data-[active=true]:bg-border data-[active=true]:text-white tab-btn"
          data-receive="receive"
          data-active="true"
        >
          Receive
        </button>
      </div>

      <div
        id="content"
        class="p-12 border-b-4 min-h-96 flex flex-col justify-center"
      >
        <div id="content-send" class="data-[active=false]:hidden animate-popin" data-active="false">
          send
        </div>

        <div id="content-receive" class="data-[active=false]:hidden animate-popin" data-active="true">
          <!--Input state-->
          <div class="flex flex-col data-[active=false]:hidden items-center justify-center" data-active="false">
            <span class="icon mb-5">🎯</span>
            <h2 class="text-3xl font-bold uppercase">ENTER TARGET CODE</h2>
            <div class="my-8"><input type="text" placeholder="ABC-123" class="input-code" /></div>
            <button class="btn btn-primary mt-6">CONNECT</button>
          </div>

          <!--Connection state-->
          <div class="flex flex-col gap-6 data-[active=false]:hidden items-center justify-center" data-active="false">
            <div class="w-16 h-16 border-6 border-t-accent-2 rounded-full animate-spin mx-auto"></div>
            <h2 class="text-3xl font-bold uppercase">JACKING IN...</h2>
          </div>

          <!--Connection Error state-->
          <div class="flex flex-col gap-6 data-[active=false]:hidden items-center justify-center" data-active="false">
            <div class="w-full text-center bg-accent-1 border-4 p-6 font-bold text-xl shadow-brutal-md -rotate-2 text-white">CRITICAL: CONNECTION FAILED</div>
            <button class="btn btn-danger mt-6">RETRY</button>
          </div>

          <!--Ready state-->
          <div class="flex flex-col data-[active=false]:hidden items-center justify-center" data-active="false">
            <span class="icon mb-5">✨</span>
            <h2 class="text-3xl font-bold uppercase">LINK ESTABLISHED</h2>
            <div class="my-8 flex gap-5 items-center">
              <div class="badge bg-accent-3">ARCHIVE.ZIP</div>
              <div class="badge bg-accent-5 text-white">4.2 GB</div>
              <div class="badge bg-accent-4">SENDER: ALICE_PC</div>
            </div>
            <button class="btn btn-primary mt-6">DOWNLOAD NOW</button>
          </div>

          <!--Download state-->
          <div class="flex flex-col data-[active=false]:hidden items-center justify-center" data-active="true">
            <h2 class="text-3xl font-bold uppercase">PULLING DATA</h2>
            <div class="w-full h-12 border-4 rounded-lg shadow-brutal-md overflow-hidden my-8">
              <div class="bg-accent-2 h-full w-72 border-r-4 bg-[linear-gradient(45deg,rgba(0,0,0,0.1)_25%,transparent_25%,transparent_50%,rgba(0,0,0,0.1)_50%,rgba(0,0,0,0.1)_75%,transparent_75%,transparent)] bg-size-[20px_20px]"></div>
            </div>
            <h2 class="text-3xl font-bold uppercase">66% - 15 SECONDS LEFT</h2>
          </div>
        </div>
      </div>

      <footer class="p-4">
        <button class="hover:underline cursor-pointer">Help?<button/>
      </footer>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
